# Interactable objects (ids must match scene prop ids)
# label = hover prompt name; title = examine panel heading
items:
  computer:
    label: Computer
    title: Old computer
    body: >
      A CRT still warm to the touch. The desktop holds specs and shipped work —
      systems built with European teams, American teams, and Canadian teams,
      then left running.
    linkText: Open GitHub file
    href: https://github.com/MikeIbberson
    found: You examined the computer. The fan ticks like a clock.

  bookshelf:
    label: Bookshelf
    title: Bookshelf
    body: >
      Crowded spines. Dog-eared pages. Notes tucked between chapters like evidence.
      This is where ideas get pressure-tested before they leave the room — thought
      leadership with fingerprints on it.
    linkText: Open Medium file
    href: https://medium.com/@michaelibberson
    found: You examined the bookshelf. Dust motes spin in the beam.

  runner:
    label: Running statue
    title: Running statue
    body: >
      A small figure frozen mid-stride on the desk. Mud miles and early mornings live
      in that pose — Pickering routes logged until the pattern looks like devotion.
    linkText: Open Strava file
    href: https://strava.app.link/LI1HHXNIE6b
    found: You examined the running statue. It still looks like it might move.

  guitar:
    label: Guitar
    title: Acoustic guitar
    body: >
      Lacquer worn at the strum path. A folded setlist under the strings. This is not
      decoration — the subject is a musician, and the room still holds the shape of
      unfinished songs.
    linkText: Open Spotify file
    href: https://open.spotify.com/artist/1rkWHQrbpZak1HZLMknIOG
    found: You examined the guitar. One string hums when you breathe.

  dog:
    label: Robot dog
    title: Steampunk robot dog
    body: >
      Brass joints. A faint tick of gears. Someone in this room keeps company that
      never needs a leash — loyal circuitry with a personality file all its own.
    linkText: Open Instagram file
    href: https://www.instagram.com/sundae.aussie
    found: You examined the robot dog. Its head tracks the flashlight.

  mug:
    label: Coffee mug
    title: Coffee mug
    body: >
      A ring of dried espresso on the rim. Refilled more times than the room has
      windows. Whatever else is true about the subject, the coffee is non-negotiable.
    linkText: null
    href: null
    found: You examined the mug. Still warm, somehow.

  textlayer:
    label: Textlayer
    title: Textlayer
    body: >
      A framed mark on the wall. I work here — at Textlayer, building tools that
      make language models useful, trustworthy, and a little less mysterious.
    linkText: Open textlayer.ai
    href: https://www.textlayer.ai/
    found: You examined the Textlayer frame. The mark catches the beam.

  photo:
    label: Photograph
    title: Framed photograph
    body: >
      Subject: Mike Ibberson. Last known residence: Pickering, Ontario — near Toronto.
      The eyes in the frame are the same ones that built this room. A garden behind him.
      A file in front of you.
    linkText: Open LinkedIn file
    href: https://www.linkedin.com/in/michaelibberson/
    found: You examined the photograph. The eyes hold the beam.

  passport:
    label: Travel folder
    title: Travel folder
    body: >
      I'm an avid traveller and adventurer — more than fifteen countries so far,
      and still adding stamps.
    linkText: null
    href: null
    found: You examined the travel folder. The stamps overlap like a map.

# Object ids that unlock the "short path" ticker message when all are found
primaryItems:
  - computer
  - bookshelf
  - textlayer
