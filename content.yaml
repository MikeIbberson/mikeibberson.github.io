about:
  close: Close
  socialsAriaLabel: Social links
  body: >
    I design and ship AI systems that hold up in the real world — from
    architecture and evaluation to the last mile of product polish. Based
    in Toronto, I work at Textlayer building tools that make language
    models useful, trustworthy, and a little less mysterious. This room is
    my dossier: wander if you want the long version, or skip straight to
    the files below.
